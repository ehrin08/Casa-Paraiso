# Isolated verification only. Use the wrapper with an explicit non-default -ProjectName.
services:
  app:
    image: casa-paraiso-web-app
    command: ['sh', '-c', 'mkdir -p storage/framework/cache/data storage/framework/views storage/framework/sessions bootstrap/cache && chown -R www-data:www-data storage/framework bootstrap/cache && exec apache2-foreground']
    ports:
      - '127.0.0.1:${TEST_APP_PORT:-18002}:80'
    environment:
      APP_ENV: testing
      APP_URL: http://localhost:${TEST_APP_PORT:-18002}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      MAIL_MAILER: array
      CACHE_STORE: array
      SESSION_DRIVER: file
      SESSION_COOKIE: casa_schedule_test_session
      SESSION_SECURE_COOKIE: 'false'
    volumes:
      - '.:/var/www/html'
      - 'vendor:/var/www/html/vendor:ro'
      - 'node_modules:/var/www/html/node_modules'
      - 'storage-framework:/var/www/html/storage/framework'
      - 'storage-logs:/var/www/html/storage/logs'
      - 'bootstrap-cache:/var/www/html/bootstrap/cache'
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: testing
      MARIADB_USER: sail
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: testing-root
    volumes:
      - 'mariadb-data:/var/lib/mysql'
      - './docker/mariadb/init/01-create-testing-database.sql:/docker-entrypoint-initdb.d/01-create-testing-database.sql:ro'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  mariadb-data: {}
  storage-framework: {}
  storage-logs: {}
  bootstrap-cache: {}
  vendor:
    external: true
    name: casa-paraiso-web_vendor
  node_modules:
    external: true
    name: casa-paraiso-web_node_modules
