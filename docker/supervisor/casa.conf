[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/casa-supervisord.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
directory=/var/www/html
command=/usr/local/bin/php artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autorestart=true
startretries=20
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
