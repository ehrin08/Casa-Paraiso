name: casa-paraiso-web

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:${APP_PORT:-18001}:80'
      - '127.0.0.1:${FORWARD_VITE_PORT:-15173}:5173'
    volumes:
      - '.:/var/www/html'
      - 'vendor:/var/www/html/vendor'
      - 'node_modules:/var/www/html/node_modules'
      - 'storage-logs:/var/www/html/storage/logs'
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - casa

  mariadb:
    image: 'mariadb:10.11'
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-13306}:3306'
    environment:
      MARIADB_DATABASE: '${DB_DATABASE:-casa_paraiso}'
      MARIADB_USER: '${DB_USERNAME:-sail}'
      MARIADB_PASSWORD: '${DB_PASSWORD:-password}'
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD:-rootpassword}'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
      - './docker/mariadb/init/01-create-testing-database.sql:/docker-entrypoint-initdb.d/01-create-testing-database.sql:ro'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - casa

  mailpit:
    image: 'axllent/mailpit:v1.28.3'
    ports:
      - '127.0.0.1:${FORWARD_MAILPIT_PORT:-11026}:1025'
      - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-18025}:8025'
    networks:
      - casa

networks:
  casa:
    driver: bridge

volumes:
  # The retired mysql-data volume is deliberately not reused or deleted.
  mariadb-data:
    driver: local
  vendor:
    driver: local
  node_modules:
    driver: local
  storage-logs:
    driver: local
