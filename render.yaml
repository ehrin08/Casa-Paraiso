services:
  - type: web
    runtime: docker
    name: casa-paraiso-web
    repo: https://github.com/ehrin08/Casa-Paraiso.git
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Casa Paraiso
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_COLLATION
        value: utf8mb4_unicode_ci
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/oracle-mysql-ca.pem
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: FORCE_HTTPS
        value: "true"
      - key: HSTS_ENABLED
        value: "true"
      - key: TRUSTED_HOSTS
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SYSTEM_ERROR_REPORTING_ENABLED
        value: "true"
      - key: SYSTEM_ERROR_RETENTION_DAYS
        value: "30"
      - key: SYSTEM_ERROR_BADGE_CACHE_SECONDS
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Casa Paraiso
      - key: RUN_MIGRATIONS
        value: "false"
